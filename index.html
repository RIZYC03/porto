<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio</title>
<meta name="description" content="Portofolio drafter engineering & desainer arsitektur">
<meta name="theme-color" content="#04060c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--bg2:#09101f;--card:#0a1226;--line:#17233f;--ink:#eaf1ff;--mut:#8fa0c2;--ac:#3b82f6;--ac2:#22d3ee;--dan:#ff6b6b;--h:'Oswald',Impact,'Arial Narrow',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.7 'Poppins',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{margin:0;font-family:var(--h);font-weight:700;text-transform:uppercase;line-height:1.1;letter-spacing:.01em}
a{color:var(--ac2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(4,6,12,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hw{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--h);font-weight:700;font-size:18px;text-transform:uppercase;text-decoration:none;color:var(--ink);letter-spacing:.04em}
.brand small{display:block;font:400 11px 'Poppins';color:var(--ac);letter-spacing:.12em}
#links{display:flex;gap:2px}
#links a{color:var(--mut);text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px}
#links a:hover{color:var(--ink)}
#links a[aria-current=page]{color:var(--ink);background:var(--bg2);box-shadow:inset 0 -2px 0 var(--ac)}
#mb{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
@media(max-width:860px){#mb{display:block}#links{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;padding:8px 16px}#links.open{display:flex}}
main{flex:1;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){main{animation:none}html{scroll-behavior:auto}}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 64px}
.pt{font-size:clamp(34px,6vw,56px);margin-bottom:6px}
.bar1{width:56px;height:3px;background:var(--ac);border-radius:2px;margin:10px 0 28px}
.sub{color:var(--mut);max-width:60ch;margin:0 0 28px}
/* hero */
.hero{position:relative;overflow:hidden;min-height:calc(100svh - 62px);min-height:max(620px,calc(100svh - 62px));background:radial-gradient(900px 600px at 80% 30%,#0f3a8a66,transparent 70%),linear-gradient(180deg,#04060c,#070d1c)}
.hero .in{position:relative;max-width:1180px;margin:0 auto;padding:0 24px;min-height:inherit}
.big{position:absolute;left:24px;top:clamp(10px,4vw,48px);font-family:var(--h);font-weight:700;font-size:clamp(60px,15vw,230px);line-height:.95;white-space:nowrap;letter-spacing:.01em;margin:0;background:linear-gradient(180deg,#3b82f6 10%,#0c2c6e 95%);-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none}
.hp{position:absolute;right:0;bottom:0;height:min(92%,780px);max-width:56%;object-fit:contain;object-position:bottom right;z-index:2;filter:drop-shadow(0 0 40px #1d4ed855)}
.ht{position:absolute;left:24px;bottom:clamp(28px,6vw,70px);z-index:3;max-width:min(560px,52%)}
.ht .nm{font-family:var(--h);text-transform:uppercase;letter-spacing:.14em;color:var(--ac2);font-size:14px;margin:0 0 8px;font-weight:500}
.ht h1{font-size:clamp(28px,4.6vw,56px)}
.ht p{color:var(--mut);margin:14px 0 22px;font-size:clamp(15px,1.6vw,19px)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ac);background:transparent;color:var(--ink);padding:10px 22px;border-radius:999px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;font-size:14px}
.btn:hover{background:#3b82f622}
.btn.p{background:var(--ac);color:#fff}.btn.p:hover{background:#2f6fe0}
.btn.g{border-color:var(--line);color:var(--mut)}
.btn.d{border-color:var(--dan);color:var(--dan)}
.btn.s{padding:3px 12px;font-size:12px}
@media(max-width:760px){
 .hero{min-height:calc(100svh - 62px)}
 .big{top:12px;font-size:17vw}
 .hp{max-width:78%;height:46%;right:-4%}
 .ht{max-width:100%;right:24px;bottom:auto;top:clamp(80px,24vw,150px)}
 .ht h1{font-size:26px;max-width:60%}.ht p{max-width:55%;font-size:14px;margin:8px 0 14px}
}
/* about */
.ab{display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:start}
@media(max-width:820px){.ab{grid-template-columns:1fr}}
.pc{border:1px solid var(--line);border-radius:16px;background:radial-gradient(circle at 50% 30%,#1d4ed855,transparent 70%),var(--card);aspect-ratio:4/5;overflow:hidden;display:flex;align-items:flex-end}
.pc img{width:100%;height:100%;object-fit:contain;object-position:bottom}
.ap{white-space:pre-line;margin:0;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:44px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.two h2{font-size:24px;margin-bottom:14px}
.sk{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sk li{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.sk li:before{content:"";width:8px;height:8px;border-radius:2px;background:var(--ac);flex:none}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tools div{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px 10px;text-align:center;font-weight:500;font-size:14px}
/* timeline */
.tl{border-left:2px solid var(--line);margin:0 0 44px 8px;display:grid;gap:26px}
.tli{position:relative;padding-left:26px}
.tli:before{content:"";position:absolute;left:-9px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px var(--bg),0 0 14px var(--ac)}
.per{color:var(--ac2);font-size:13px;font-weight:500}
.tli h3{font-size:20px;margin:2px 0}
.meta{color:var(--mut);font-size:14px}
.tli ul{margin:10px 0 0;padding-left:18px;color:#c4d0ea}
.tli li{margin:3px 0}
.h2{font-size:26px;margin:0 0 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.cd{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.cd:hover{border-color:var(--ac);transform:translateY(-3px)}
.th{aspect-ratio:16/10;background:var(--bg2);position:relative;cursor:pointer;border:0;padding:0;width:100%;display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;right:10px;bottom:10px;background:rgba(4,6,12,.78);border:1px solid var(--line);font-size:12px;padding:2px 10px;border-radius:999px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.cb h3{font-size:17px;text-transform:none;font-family:'Poppins';font-weight:600}
.cb p{margin:6px 0 0;font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act{display:flex;gap:6px;margin-top:10px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--mut)}
/* contact */
.ct{display:grid;grid-template-columns:1fr 1fr;gap:44px}
@media(max-width:820px){.ct{grid-template-columns:1fr}}
.cl{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}
.cl li{display:flex;gap:12px;align-items:center}
.cl i{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-style:normal;color:var(--ac2);font-size:12px;font-weight:600;flex:none}
.cl a{color:var(--ink);text-decoration:none;word-break:break-all}.cl a:hover{color:var(--ac2)}
form{display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:500;font-size:13px;color:var(--mut)}
input,select,textarea{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);width:100%;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:13px;padding:18px 12px 80px}
footer a{color:var(--mut)}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--ink);width:min(760px,95vw);padding:22px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.72)}
dialog h2{font-size:22px;margin-bottom:12px}
.fr{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.gm{width:100%;max-height:60vh;object-fit:contain;background:#000;display:block;cursor:zoom-in}
.gt{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.gt img{width:66px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;flex:none}
.gt img.on{border-color:var(--ac2)}
.gt{margin:10px 0}
.tn{display:flex;gap:8px;flex-wrap:wrap}
.tn div{position:relative}.tn img{width:72px;height:54px;object-fit:cover;border-radius:6px}
.tn button{position:absolute;top:-6px;right:-6px;border-radius:50%;border:0;background:var(--dan);color:#fff;width:20px;height:20px;cursor:pointer;line-height:1}
#lb{padding:0;border:0;border-radius:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;background:rgba(0,0,0,.93)}
.ls{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
#lbi{max-width:100vw;max-height:100dvh;display:block;background:#fff;touch-action:pan-y;user-select:none;-webkit-user-drag:none}
.gs{position:relative;overflow:hidden;border-radius:10px;background:#000}
.gm{touch-action:pan-y;user-select:none;-webkit-user-drag:none}
.nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:rgba(4,6,12,.62);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px;z-index:2}
.nv:hover{background:var(--ac)}.nv[hidden]{display:none}
.pv{left:10px}.nx{right:10px}
.lx{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:rgba(4,6,12,.62);color:#fff;font-size:24px;cursor:pointer;z-index:3}
.gc{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(4,6,12,.72);border:1px solid var(--line);font-size:12px;padding:2px 12px;border-radius:999px;z-index:2}
.kt{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);padding:7px 18px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px}
.chip:hover{color:var(--ink);border-color:var(--ac)}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.chip small{opacity:.7;margin-left:4px;font-size:12px}
.th.p2{background:#fff}.th.p2 img{object-fit:contain}
.tn button.ty{top:auto;right:auto;left:2px;bottom:2px;width:auto;height:auto;border-radius:6px;padding:1px 6px;font-size:11px;background:var(--ac)}
.ro,.adm{display:none}
body.edit .ro{display:inline-block}
body.edit .adm{display:flex}
.abar{position:fixed;left:0;right:0;bottom:0;background:#0f1b38;border-top:1px solid var(--ac);padding:10px 20px;gap:10px;align-items:center;justify-content:space-between;z-index:30;flex-wrap:wrap}
.note{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header><div class="hw"><a class="brand" href="#/" id="brand"></a><button id="mb" aria-label="Menu" aria-expanded="false">Menu</button><nav id="links" aria-label="Navigasi utama"></nav></div></header>
<main id="app"></main>
<footer id="ft"></footer>
<div class="abar adm"><span id="st" class="note">Mode admin — perubahan belum dipublikasikan.</span><span style="display:flex;gap:8px"><button class="btn p s" id="bPub">Publikasikan</button><button class="btn s" id="bOut">Keluar</button></span></div>

<dialog id="dd"><div id="ddb"></div><div class="fr" style="margin-top:14px"><button class="btn g" data-close>Tutup</button></div></dialog>
<dialog id="de"><h2 id="det"></h2><form id="fe" method="dialog"><div id="feb" style="display:grid;gap:12px"></div><div class="fr"><button type="button" class="btn g" data-close>Batal</button><button class="btn p">Simpan</button></div></form></dialog>
<dialog id="dl"><h2>Masuk admin</h2>
<form id="fl" method="dialog">
<p class="note">Hanya pemilik repo GitHub yang bisa mengubah isi web. Buat token di GitHub: Settings → Developer settings → Fine-grained tokens → pilih repo ini saja → izin <b>Contents: Read and write</b>. Token hanya disimpan di browser ini.</p>
<label>Username GitHub<input id="lo" required></label>
<label>Nama repository<input id="lr" required></label>
<label>Branch<input id="lb2" value="main" required></label>
<label>Token<input id="lt" type="password" required autocomplete="off"></label>
<div class="fr"><button type="button" class="btn g" data-close>Batal</button><button class="btn p">Masuk</button></div></form></dialog>
<dialog id="lb" aria-label="Foto layar penuh"><div class="ls" id="ls"><img id="lbi" alt="" draggable="false"><button class="nv pv" data-n="-1" aria-label="Foto sebelumnya">&#8249;</button><button class="nv nx" data-n="1" aria-label="Foto berikutnya">&#8250;</button><button class="lx" data-close aria-label="Tutup">&times;</button><span class="gc" id="lbc"></span></div></dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAGES={home:'Beranda',tentang:'Tentang',pengalaman:'Pengalaman',hasil:'Hasil kerja',dok:'Dokumentasi',kontak:'Kontak'};
const SEC={
 experience:{t:'Pengalaman',a:'Tambah pengalaman',f:{title:'Jabatan',sub:'Perusahaan',period:'Periode (mis. Jun 2025 – sekarang)',place:'Lokasi',desc:'Uraian tugas (satu poin per baris)'}},
 education:{t:'Pendidikan',a:'Tambah pendidikan',f:{title:'Jurusan / program',sub:'Sekolah / kampus',period:'Periode',desc:'Keterangan (opsional)'}},
 work:{t:'Hasil kerja',a:'Tambah proyek',img:1,f:{title:'Nama proyek',sub:'Lokasi / klien',period:'Tahun / periode',desc:'Konsep dan keterangan',list:'Lingkup pekerjaan (satu per baris)',tools:'Tools'}},
 docs:{t:'Dokumentasi',a:'Tambah dokumentasi',img:1,f:{title:'Judul',sub:'Lokasi',period:'Tanggal',desc:'Keterangan'}}
};
const tp=(it,i)=>(it.types&&it.types[i])||'3d';
let KIND='all';
let D,A=JSON.parse(localStorage.getItem('adm')||'null'),dirty=false,PREV={},ED=null,G=null;
const src=p=>PREV[p]||p;
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

/* ---------- GitHub ---------- */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
function gh(path,method='GET',body){return fetch(`https://api.github.com/repos/${A.o}/${A.r}/contents/${path}`+(method==='GET'?`?ref=${A.b}&t=${Date.now()}`:''),{method,headers:{Authorization:'Bearer '+A.t,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)})}
async function ghLoad(){const r=await gh('data.json');if(!r.ok)throw 0;const j=await r.json();return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))))}
async function publish(){
  const st=$('#st');$('#bPub').disabled=true;
  try{
    const ups=[];
    for(const k of ['work','docs'])for(const o of D[k])for(let i=0;i<o.images.length;i++)if(o.images[i].startsWith('data:'))ups.push([o.images,i]);
    if(D.profile.photo.startsWith('data:'))ups.push([D.profile,'photo']);
    let n=0;
    for(const [h,k] of ups){
      st.textContent=`Mengunggah gambar ${++n}/${ups.length}...`;
      const du=h[k],ext=du.startsWith('data:image/webp')?'webp':du.startsWith('data:image/png')?'png':'jpg';
      const path=`images/u${Date.now().toString(36)}${n}.${ext}`;
      const r=await gh(path,'PUT',{message:'Upload gambar',content:du.split(',')[1],branch:A.b});
      if(!r.ok)throw new Error('Gagal mengunggah gambar ('+r.status+')');
      PREV[path]=du;h[k]=path;
    }
    st.textContent='Menyimpan data.json...';
    const cur=await gh('data.json');const sha=cur.ok?(await cur.json()).sha:undefined;
    const r=await gh('data.json','PUT',{message:'Update portofolio',content:b64(JSON.stringify(D,null,1)),branch:A.b,sha});
    if(!r.ok)throw new Error('Gagal menyimpan data.json ('+r.status+')');
    dirty=false;st.textContent='Terpublikasi. Situs publik diperbarui otomatis oleh Vercel dalam ±1 menit.';
  }catch(e){st.textContent='Error: '+e.message+' — periksa token dan nama repo.'}
  $('#bPub').disabled=false;
}
function shrink(file,max,type){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(type,.84))};im.src=r.result};r.readAsDataURL(file)})}

/* ---------- halaman ---------- */
const route=()=>{const r=location.hash.replace(/^#\/?/,'')||'home';return PAGES[r]?r:'home'};
const acts=(k,id)=>`<div class="act ro"><button class="btn s g" data-e="${k}|${id}">Ubah</button><button class="btn s d" data-x="${k}|${id}">Hapus</button></div>`;
const addBtn=k=>`<button class="btn s ro" data-a="${k}">+ ${SEC[k].a}</button>`;
function tl(k){const L=D[k];return L.length?`<div class="tl">${L.map(i=>`<div class="tli"><div class="per">${esc(i.period)}</div><h3>${esc(i.title)}</h3><div class="meta">${[i.sub,i.place].filter(Boolean).map(esc).join(' • ')}</div>${lines(i.desc).length?`<ul>${lines(i.desc).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${acts(k,i.id)}</div>`).join('')}</div>`:'<div class="empty">Belum ada isi.</div>'}
function cards(k){let L=D[k];if(k==='work'&&KIND!=='all')L=L.filter(i=>i.images.some((_,j)=>tp(i,j)===KIND));
const cv=i=>{if(k!=='work'||KIND==='all')return 0;return i.images.findIndex((_,j)=>tp(i,j)===KIND)};
const bd=i=>{if(k!=='work')return i.images.length+' foto';if(KIND!=='all')return i.images.filter((_,j)=>tp(i,j)===KIND).length+' foto '+KIND.toUpperCase();const c={'3d':0,'2d':0};i.images.forEach((_,j)=>c[tp(i,j)]++);return [c['3d']&&'3D '+c['3d'],c['2d']&&'2D '+c['2d']].filter(Boolean).join(' · ')};
return L.length?`<div class="grid">${L.map(i=>`<article class="cd"><button class="th${k==='work'&&i.images.length&&tp(i,cv(i))==='2d'?' p2':''}" data-v="${k}|${i.id}" aria-label="Lihat ${esc(i.title)}">${i.images.length?`<img loading="lazy" src="${esc(src(i.images[cv(i)]))}" alt="${esc(i.title)}"><span>${bd(i)}</span>`:''}</button><div class="cb"><h3>${esc(i.title)}</h3><div class="meta">${[i.sub,i.period].filter(Boolean).map(esc).join(' • ')}</div>${i.desc?`<p>${esc(i.desc)}</p>`:''}${acts(k,i.id)}</div></article>`).join('')}</div>`:'<div class="empty">Belum ada isi. Masuk admin untuk menambahkan.</div>'}
const head=(t,s)=>`<h1 class="pt">${t}</h1><div class="bar1"></div>${s?`<p class="sub">${s}</p>`:''}`;
const PG={
 home(){const p=D.profile;return `<section class="hero"><div class="in"><p class="big" aria-hidden="true">PORTOFOLIO</p><img class="hp" src="${esc(src(p.photo))}" alt="Foto ${esc(p.name)}"><div class="ht"><p class="nm">${esc(p.name)}</p><h1>${esc(p.headline)}</h1><p>${esc(p.tagline)}</p><div class="cta"><a class="btn p" href="#/hasil">Lihat hasil kerja</a><a class="btn" href="#/kontak">Hubungi saya</a></div></div></div></section>`},
 tentang(){const p=D.profile;return `<div class="wrap">${head('Tentang saya')}<div class="ab"><div class="pc"><img src="${esc(src(p.photo))}" alt="Foto ${esc(p.name)}"></div><div><p class="ap">${esc(p.about)}</p><div class="cta" style="margin-top:22px"><a class="btn p" href="#/pengalaman">Pengalaman saya</a><button class="btn ro" data-pe>Ubah profil</button></div></div></div>
  <div class="two"><div><h2>Keahlian</h2><ul class="sk">${(p.skills||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><div><h2>Tools yang saya pakai</h2><div class="tools">${(p.tools||[]).map(s=>`<div>${esc(s)}</div>`).join('')}</div></div></div></div>`},
 pengalaman(){return `<div class="wrap">${head('Pengalaman & pendidikan')}<h2 class="h2">Pengalaman kerja ${addBtn('experience')}</h2>${tl('experience')}<h2 class="h2">Pendidikan ${addBtn('education')}</h2>${tl('education')}</div>`},
 hasil(){const n=k=>D.work.filter(i=>k==='all'||i.images.some((_,j)=>tp(i,j)===k)).length;const ch=[['all','Semua'],['3d','3D'],['2d','2D']].map(([k,l])=>`<button class="chip" data-kf="${k}" aria-pressed="${KIND===k}">${l}<small>${n(k)}</small></button>`).join('');return `<div class="wrap">${head('Hasil kerja','Rumah tinggal, kantor, dan perumahan: gambar kerja, fasad 3D, rendering, dan shop drawing. Pilih 3D atau 2D, lalu klik kartu. Di dalam galeri, geser kiri atau kanan untuk pindah foto.')}<div class="kt" style="margin-bottom:16px" role="group" aria-label="Jenis hasil kerja">${ch}<span style="flex:1"></span>${addBtn('work')}</div>${cards('work')}</div>`},
 dok(){return `<div class="wrap">${head('Dokumentasi','Foto pekerjaan di lapangan dan proses kerja.')}<div style="margin-bottom:16px">${addBtn('docs')}</div>${cards('docs')}</div>`},
 kontak(){const p=D.profile,wa=(p.wa||'').replace(/\D/g,''),ext=u=>/^https?:\/\//i.test(u||'')?u:'';
  const L=[p.email&&['@',`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`],wa&&['WA',`<a target="_blank" rel="noopener" href="https://wa.me/${wa}">+${esc(wa)}</a>`],p.location&&['Lok',esc(p.location)],...[['linkedin','in','LinkedIn'],['github','Gh','GitHub'],['instagram','Ig','Instagram']].map(([k,i,n])=>ext(p[k])&&[i,`<a target="_blank" rel="noopener" href="${esc(p[k])}">${n}</a>`])].filter(Boolean);
  return `<div class="wrap"><div class="ct"><div>${head('Mari bekerja sama','Punya proyek desain, gambar kerja, atau survei lapangan? Kirim pesan atau hubungi langsung.')}<ul class="cl">${L.map(([i,h])=>`<li><i>${i}</i><span>${h}</span></li>`).join('')}</ul></div>
  <form id="cf" novalidate style="align-content:start;margin-top:8px"><label>Nama Anda<input id="cn" required autocomplete="name"></label><label>Email Anda<input id="ce" type="email" required autocomplete="email"></label><label>Pesan<textarea id="cm" required></textarea></label><div class="fr" style="justify-content:flex-start"><button class="btn p" data-via="mail">Kirim lewat email</button><button class="btn" data-via="wa">Kirim lewat WhatsApp</button></div></form></div></div>`}
};
function render(){
  const p=D.profile,r=route();document.title=(r==='home'?p.name:PAGES[r]+' — '+p.name);
  document.body.classList.toggle('edit',!!A);
  $('#brand').innerHTML=`${esc(p.name)}<small>${esc(p.headline)}</small>`;
  $('#links').innerHTML=Object.entries(PAGES).map(([k,v])=>`<a href="#/${k==='home'?'':k}" ${k===r?'aria-current="page"':''}>${v}</a>`).join('');
  $('#links').classList.remove('open');$('#mb').setAttribute('aria-expanded','false');
  $('#app').innerHTML=PG[r]();
  $('#ft').innerHTML=`© ${new Date().getFullYear()} ${esc(p.name)} · <a href="#" id="aLogin">Admin</a>`;
  $('#aLogin').onclick=e=>{e.preventDefault();A?alert('Anda sudah masuk sebagai admin.'):$('#dl').showModal()};
  const cf=$('#cf');if(cf)cf.onsubmit=sendMsg;
}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});
$('#mb').onclick=()=>{const o=$('#links').classList.toggle('open');$('#mb').setAttribute('aria-expanded',o)};
function sendMsg(e){e.preventDefault();const p=D.profile,n=$('#cn').value.trim(),m=$('#cm').value.trim(),em=$('#ce').value.trim(),via=e.submitter?.dataset.via;
  if(!n||!m||!/^\S+@\S+\.\S+$/.test(em)){alert('Isi nama, email yang valid, dan pesan.');return}
  const body=`${m}\n\nDari: ${n} (${em})`;
  if(via==='wa'){if(!p.wa){alert('Nomor WhatsApp belum tersedia.');return}open(`https://wa.me/${p.wa.replace(/\D/g,'')}?text=${encodeURIComponent(body)}`,'_blank')}
  else{if(!p.email){alert('Email belum tersedia.');return}location.href=`mailto:${p.email}?subject=${encodeURIComponent('Pesan dari '+n)}&body=${encodeURIComponent(body)}`}}

/* ---------- detail & galeri ---------- */
function gl(){const it=G.it;return it.images.filter((_,j)=>G.kind==='all'||tp(it,j)===G.kind)}
function showGal(){if(!G.l.length)return;const s=src(G.l[G.i]),c=`${G.i+1} / ${G.l.length}`;
  const gm=$('#gm');gm.src=s;gm.alt=G.t;$('#gc').textContent=c;
  document.querySelectorAll('.gt img').forEach((x,j)=>{x.classList.toggle('on',j===G.i);if(j===G.i)x.scrollIntoView({block:'nearest',inline:'center'})});
  if($('#lb').open){$('#lbi').src=s;$('#lbi').alt=G.t;$('#lbc').textContent=c}
  document.querySelectorAll('.nv').forEach(b=>b.hidden=G.l.length<2);
  for(const d of [1,-1]){const p=new Image();p.src=src(G.l[(G.i+d+G.l.length)%G.l.length])}}
function go(n){if(!G||G.l.length<2)return;G.i=(G.i+n+G.l.length)%G.l.length;showGal();
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)for(const im of [$('#gm'),$('#lbi')])im.animate([{opacity:.25,transform:`translateX(${n*48}px)`},{opacity:1,transform:'none'}],{duration:200,easing:'ease-out'})}
function renderGal(){const it=G.it,has=k=>it.images.some((_,j)=>tp(it,j)===k);
  const tabs=G.k==='work'&&has('3d')&&has('2d')?`<div class="kt" style="margin-bottom:10px" role="group" aria-label="Jenis foto">${[['all','Semua'],['3d','3D'],['2d','2D']].map(([k,l])=>`<button class="chip" data-gk="${k}" aria-pressed="${G.kind===k}">${l}</button>`).join('')}</div>`:'';
  G.l=gl();G.i=Math.min(G.i,Math.max(0,G.l.length-1));
  $('#gw').innerHTML=tabs+(G.l.length?`<div class="gs"><img id="gm" class="gm" alt="" draggable="false"><button class="nv pv" data-n="-1" aria-label="Foto sebelumnya">&#8249;</button><button class="nv nx" data-n="1" aria-label="Foto berikutnya">&#8250;</button><span class="gc" id="gc"></span></div>${G.l.length>1?`<div class="gt">${G.l.map((x,j)=>`<img src="${esc(src(x))}" data-g="${j}" alt="Foto ${j+1}">`).join('')}</div>`:''}`:'');
  showGal()}
function openView(k,id){const it=D[k].find(x=>x.id===id);if(!it)return;const ls=Array.isArray(it.list)?it.list.filter(Boolean):[];
  const kd=k==='work'&&KIND!=='all'&&it.images.some((_,j)=>tp(it,j)===KIND)?KIND:'all';G={it,k,kind:kd,l:[],i:0,t:it.title};
  $('#ddb').innerHTML=`<h2>${esc(it.title)}</h2><div class="meta" style="margin-bottom:12px">${[it.sub,it.period].filter(Boolean).map(esc).join(' • ')}</div><div id="gw"></div>${it.desc?`<p style="white-space:pre-line">${esc(it.desc)}</p>`:''}${ls.length?`<b>Lingkup pekerjaan</b><ul>${ls.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${it.tools?`<p class="meta">Tools: ${esc(it.tools)}</p>`:''}`;
  if(it.images.length)renderGal();$('#dd').showModal()}
/* geser kiri/kanan (sentuh & mouse) */
let SW=null,swiped=false;
document.addEventListener('pointerdown',e=>{const im=e.target.closest('#gm,#lbi');if(!im||!G||G.l.length<2)return;SW={x:e.clientX,y:e.clientY,im,m:false}});
document.addEventListener('pointermove',e=>{if(!SW)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.m&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){SW.m=true;SW.im.style.transition='none'}
  if(SW.m)SW.im.style.transform=`translateX(${dx}px)`});
const swEnd=e=>{if(!SW)return;const dx=e.clientX-SW.x,s=SW;SW=null;s.im.style.transform='';s.im.style.transition='';
  if(s.m){swiped=true;setTimeout(()=>swiped=false,300);if(e.type==='pointerup'&&Math.abs(dx)>50)go(dx<0?1:-1)}};
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);

/* ---------- editor ---------- */
function openEdit(k,id){const isNew=!id;const it=isNew?{id:'i'+Date.now().toString(36),title:'',sub:'',period:'',place:'',desc:'',list:[],tools:'',images:[],types:[]}:JSON.parse(JSON.stringify(D[k].find(x=>x.id===id)));
  if(k==='work')it.types=it.images.map((_,j)=>tp(it,j));else delete it.types;
  ED={k,it,isNew};$('#det').textContent=isNew?SEC[k].a:'Ubah '+SEC[k].t.toLowerCase();
  $('#feb').innerHTML=Object.entries(SEC[k].f).map(([n,l])=>{const v=n==='list'?(it.list||[]).join('\n'):it[n]||'';return `<label>${l}${['desc','list'].includes(n)?`<textarea name="${n}">${esc(v)}</textarea>`:`<input name="${n}" value="${esc(v)}" ${n==='title'?'required':''}>`}</label>`}).join('')+(SEC[k].img?`${k==='work'?'<label>Jenis gambar yang akan ditambahkan<select id="ft2"><option value="3d">3D (render / model)</option><option value="2d">2D (gambar kerja)</option></select></label>':''}<label>Tambah gambar (boleh banyak)<input type="file" id="fi" accept="image/*" multiple></label><div class="tn" id="tn"></div>`:'');
  thumbs();$('#de').showModal()}
function thumbs(){const t=$('#tn');if(!t)return;t.innerHTML=ED.it.images.map((x,j)=>`<div><img src="${esc(src(x))}" alt="">${ED.it.types?`<button type="button" class="ty" data-ty="${j}" aria-label="Ganti jenis foto">${tp(ED.it,j).toUpperCase()}</button>`:''}<button type="button" data-rm="${j}" aria-label="Hapus gambar">×</button></div>`).join('')}
function openProf(){const p=D.profile;ED={prof:true,photo:p.photo};$('#det').textContent='Ubah profil';
  const F=[['name','Nama'],['headline','Headline / profesi'],['tagline','Kalimat singkat di beranda'],['location','Lokasi'],['about','Tentang saya','t'],['email','Email resmi'],['wa','Nomor WhatsApp (contoh 6281234567890)'],['linkedin','LinkedIn (URL)'],['github','GitHub (URL)'],['instagram','Instagram (URL)'],['skills','Keahlian (satu per baris)','t'],['tools','Tools (satu per baris)','t']];
  $('#feb').innerHTML=`<label>Foto beranda (PNG/WebP dengan latar transparan paling bagus)<input type="file" id="fp" accept="image/*"></label>`+F.map(([n,l,t])=>{const v=['skills','tools'].includes(n)?(p[n]||[]).join('\n'):p[n]||'';return `<label>${l}${t?`<textarea name="${n}" style="min-height:${n==='about'?170:100}px">${esc(v)}</textarea>`:`<input name="${n}" value="${esc(v)}">`}</label>`}).join('');
  $('#de').showModal()}
$('#fe').onsubmit=()=>{const fd=new FormData($('#fe'));
  if(ED.prof){const p=D.profile;for(const [k,v] of fd.entries()){if(k==='skills'||k==='tools')p[k]=lines(v);else if(k in p)p[k]=String(v).trim()}p.photo=ED.photo}
  else{const{k,it,isNew}=ED;for(const [n,v] of fd.entries()){if(n==='fi')continue;it[n]=n==='list'?lines(v):String(v).trim()}if(isNew)D[k].unshift(it);else D[k]=D[k].map(x=>x.id===it.id?it:x)}
  dirty=true;$('#st').textContent='Ada perubahan yang belum dipublikasikan.';render()};

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest(s);let m;
  if(c('[data-close]'))return c('dialog').close();
  if(m=c('[data-kf]')){KIND=m.dataset.kf;return render()}
  if(m=c('[data-gk]')){G.kind=m.dataset.gk;G.i=0;return renderGal()}
  if(m=c('[data-n]'))return go(+m.dataset.n);
  if(m=c('[data-v]'))return openView(...m.dataset.v.split('|'));
  if(m=c('[data-g]')){G.i=+m.dataset.g;return showGal()}
  if(t.id==='gm'){if(swiped)return;$('#lb').showModal();return showGal()}
  if(t.id==='ls')return $('#lb').close();
  if(m=c('[data-e]'))return openEdit(...m.dataset.e.split('|'));
  if(m=c('[data-a]'))return openEdit(m.dataset.a);
  if(m=c('[data-x]')){const[k,id]=m.dataset.x.split('|');if(confirm('Hapus item ini?')){D[k]=D[k].filter(x=>x.id!==id);dirty=true;$('#st').textContent='Ada perubahan yang belum dipublikasikan.';render()}return}
  if(c('[data-pe]'))return openProf();
  if(m=c('[data-ty]')){const j=+m.dataset.ty;ED.it.types[j]=tp(ED.it,j)==='2d'?'3d':'2d';return thumbs()}
  if(m=c('[data-rm]')){const j=+m.dataset.rm;ED.it.images.splice(j,1);ED.it.types&&ED.it.types.splice(j,1);return thumbs()}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='fi'){for(const f of e.target.files){ED.it.images.push(await shrink(f,1400,'image/jpeg'));if(ED.it.types)ED.it.types.push($('#ft2')?.value||'3d')}e.target.value='';thumbs()}
  if(e.target.id==='fp'&&e.target.files[0]){ED.photo=await shrink(e.target.files[0],900,'image/webp');alert('Foto dipilih. Klik "Simpan" untuk menerapkan.')}
});
document.addEventListener('keydown',e=>{if(!G||!G.l.length||!($('#dd').open||$('#lb').open))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
$('#bPub').onclick=publish;
$('#bOut').onclick=()=>{if(dirty&&!confirm('Perubahan belum dipublikasikan akan hilang. Keluar?'))return;localStorage.removeItem('adm');location.reload()};
$('#fl').onsubmit=async()=>{const a={o:$('#lo').value.trim(),r:$('#lr').value.trim(),b:$('#lb2').value.trim(),t:$('#lt').value.trim()};
  try{const r=await fetch(`https://api.github.com/repos/${a.o}/${a.r}`,{headers:{Authorization:'Bearer '+a.t}});const j=await r.json();
    if(!r.ok||!j.permissions?.push)throw 0;A=a;localStorage.setItem('adm',JSON.stringify(a));try{D=await ghLoad()}catch(x){}render()}
  catch(e){alert('Login gagal. Periksa username, repo, branch, dan izin token (Contents: Read and write).')}};
window.onbeforeunload=()=>dirty?'':undefined;
(async()=>{
  try{if(A)D=await ghLoad()}catch(e){}
  if(!D){try{D=await (await fetch('data.json?'+Date.now())).json()}catch(e){$('#app').innerHTML='<div class="wrap">Gagal memuat data.json.</div>';return}}
  D.profile.tools=D.profile.tools||[];D.profile.tagline=D.profile.tagline||'';
  render();
})();
</script>
</body>
</html>
